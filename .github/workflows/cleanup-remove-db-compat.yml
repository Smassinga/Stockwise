name: CLEANUP-4D remove db compatibility

on:
  push:
    branches:
      - cleanup/remove-db-compat-20260831

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: cleanup/remove-db-compat-20260831

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Replace compatibility imports and remove db.ts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          allowed_paths = {'../lib/db', '../../lib/db', './db'}
          pattern = re.compile(r"import \{ supabase \} from (?P<quote>['\"])(?P<path>[^'\"]*db)(?P=quote)")
          changed = []
          total = 0

          for path in sorted(Path('src').rglob('*')):
              if path.suffix not in {'.ts', '.tsx'} or path.name == 'db.ts':
                  continue
              text = path.read_text(encoding='utf-8')

              def replace(match):
                  nonlocal_total[0] += 1
                  import_path = match.group('path')
                  if import_path not in allowed_paths:
                      raise SystemExit(f'Unexpected db compatibility import in {path}: {import_path}')
                  quote = match.group('quote')
                  return f"import {{ supabase }} from {quote}{import_path[:-2]}supabase{quote}"

              nonlocal_total = [0]
              updated = pattern.sub(replace, text)
              if nonlocal_total[0]:
                  total += nonlocal_total[0]
                  changed.append(str(path))
                  path.write_text(updated, encoding='utf-8')

          if total != 18:
              raise SystemExit(f'Expected exactly 18 compiled supabase compatibility imports, found {total}: {changed}')

          db_path = Path('src/lib/db.ts')
          if not db_path.exists():
              raise SystemExit('src/lib/db.ts is already absent; aborting exact cleanup package')
          db_text = db_path.read_text(encoding='utf-8')
          if "export { supabase } from './supabase'" not in db_text:
              raise SystemExit('src/lib/db.ts no longer matches expected compatibility-only role')
          db_path.unlink()

          print(f'Migrated {total} compatibility imports:')
          for item in changed:
              print(f'  {item}')
          PY

          if grep -RInE "from ['\"][^'\"]*(/|\.)db['\"]|from ['\"]\.\.?/lib/db['\"]" src --include='*.ts' --include='*.tsx'; then
            echo 'Found remaining executable db compatibility import(s).'
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:js

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Commit validated cleanup and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/cleanup-remove-db-compat.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A src .github/workflows/cleanup-remove-db-compat.yml
          git diff --cached --check
          git commit -m 'refactor: remove final db compatibility module'
          git push origin HEAD:cleanup/remove-db-compat-20260831
