name: CLEANUP-4D remove db compatibility

on:
  push:
    branches:
      - cleanup/remove-db-compat-20260831

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: cleanup/remove-db-compat-20260831

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Replace final compatibility import and remove db.ts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/pages/VendorBillDetail.tsx')
          text = path.read_text(encoding='utf-8')
          old = "import { supabase } from '../lib/db'"
          new = "import { supabase } from '../lib/supabase'"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one VendorBillDetail db compatibility import, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')

          db_path = Path('src/lib/db.ts')
          if not db_path.exists():
              raise SystemExit('src/lib/db.ts is already absent; aborting exact cleanup package')
          db_text = db_path.read_text(encoding='utf-8')
          if "export { supabase } from './supabase'" not in db_text:
              raise SystemExit('src/lib/db.ts no longer matches expected compatibility-only role')
          db_path.unlink()
          PY

          if grep -RInE "from ['\"][^'\"]*(/|\.)db['\"]|from ['\"]\.\.?/lib/db['\"]" src --include='*.ts' --include='*.tsx'; then
            echo 'Found remaining executable db compatibility import(s).'
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:js

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Commit validated cleanup and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/cleanup-remove-db-compat.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/VendorBillDetail.tsx src/lib/db.ts .github/workflows/cleanup-remove-db-compat.yml
          git diff --cached --check
          git commit -m 'refactor: remove final db compatibility module'
          git push origin HEAD:cleanup/remove-db-compat-20260831
