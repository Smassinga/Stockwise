name: Temporary master-data hook dependency cleanup

on:
  push:
    branches:
      - cleanup/final-cleanup-c-hook-deps-master-data
    paths:
      - .cleanup/trigger-hook-deps-master-data

permissions:
  contents: write

jobs:
  codemod:
    runs-on: ubuntu-latest
    env:
      VITE_SITE_URL: https://stockwiseapp.com
      VITE_SUPABASE_URL: https://stockwise-ci.invalid
      VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@v5
        with:
          ref: cleanup/final-cleanup-c-hook-deps-master-data
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply deterministic hook dependency refactor
        run: node scripts/refactor-hook-deps-master-data.mjs

      - name: Remove temporary codemod tooling
        run: |
          rm scripts/refactor-hook-deps-master-data.mjs
          rm .github/workflows/hook-deps-master-data-cleanup-codemod.yml
          rm .cleanup/trigger-hook-deps-master-data

      - name: Guard application scope
        shell: bash
        run: |
          changed="$(git diff --name-only | sort)"
          expected=$'src/pages/Customers.tsx\nsrc/pages/Suppliers.tsx'
          if [ "$changed" != "$expected" ]; then
            echo "Unexpected changed paths:"
            printf '%s\n' "$changed"
            exit 1
          fi

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Check migrations
        run: npm run check:migrations

      - name: Lint application
        run: npm run lint:js

      - name: Type-check application
        run: npm run typecheck

      - name: Check UI foundations
        run: |
          npm run check:css-vars
          npm run check:css-classes
          npm run check:ui-foundations

      - name: Guard runtime hardening
        run: node --test tests/runtime-hardening/**/*.test.mjs

      - name: Run maintained regressions
        run: |
          npm run test:dashboard
          npm run test:service-jobs
          npm run test:communications
          npm run test:operational-governance
          npm run test:ui-regression

      - name: Build production bundle
        run: npm run build

      - name: Commit application refactor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Final cleanup C7: remove master-data hook suppressions"
          git push origin HEAD:cleanup/final-cleanup-c-hook-deps-master-data
