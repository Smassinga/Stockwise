name: BOM Create Form Cleanup Codemod

on:
  push:
    branches:
      - cleanup/final-cleanup-b-bom-create

permissions:
  contents: write

jobs:
  extract-bom-create-form:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Apply deterministic BOM create-form extraction
        run: node scripts/refactor-bom-create.mjs

      - name: Remove one-time extraction tooling
        run: |
          rm -f scripts/refactor-bom-create.mjs
          rm -f .github/workflows/bom-create-cleanup-codemod.yml

      - name: Install dependencies
        run: npm ci

      - name: Check migrations
        run: npm run check:migrations

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint:js

      - name: Check UI foundations
        run: npm run check:ui-foundations

      - name: Production workspace continuity
        run: node --test --test-concurrency=1 tests/ux11d/production-growth-services-ux.test.mjs

      - name: Operations regression
        run: npm run test:ops-1

      - name: Build production bundle
        run: npm run build

      - name: Commit extracted BOM create form
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/BOM.tsx src/features/bom/BomRecipeCreateForm.tsx scripts/refactor-bom-create.mjs .github/workflows/bom-create-cleanup-codemod.yml
          git diff --cached --check
          git commit -m "refactor: extract BOM recipe create form"
          git push origin HEAD:cleanup/final-cleanup-b-bom-create
