name: Dependency Prune Helper

on:
  push:
    branches:
      - cleanup/dependency-pruning-20260830

permissions:
  contents: write

jobs:
  regenerate-lockfile:
    if: ${{ !contains(github.event.head_commit.message, '[dependency-lock-generated]') }}
    runs-on: ubuntu-24.04
    env:
      VITE_SITE_URL: https://stockwiseapp.com
      VITE_SUPABASE_URL: https://stockwise-ci.invalid
      VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@v5
        with:
          ref: cleanup/dependency-pruning-20260830
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install baseline dependencies
        run: npm ci

      - name: Identify zero-reference direct dependencies
        id: audit
        shell: bash
        run: |
          set -euo pipefail

          candidates=(
            '@dnd-kit/core'
            '@hookform/resolvers'
            '@radix-ui/react-accordion'
            '@radix-ui/react-aspect-ratio'
            '@radix-ui/react-avatar'
            '@radix-ui/react-context-menu'
            '@radix-ui/react-hover-card'
            '@radix-ui/react-menubar'
            '@radix-ui/react-navigation-menu'
            '@radix-ui/react-progress'
            '@radix-ui/react-slider'
            '@radix-ui/react-toast'
            '@radix-ui/react-toggle-group'
            '@react-three/drei'
            '@react-three/fiber'
            '@vercel/speed-insights'
            'cmdk'
            'embla-carousel-react'
            'framer-motion'
            'input-otp'
            'next-themes'
            'react-day-picker'
            'react-hook-form'
            'react-resizable-panels'
            'sonner'
          )

          search_paths=(src scripts tests supabase/functions)
          root_files=(vite.config.ts generate-icons.js generate-tauri-icons.js)
          removable=()

          for package in "${candidates[@]}"; do
            if rg --fixed-strings --quiet "$package" "${search_paths[@]}" "${root_files[@]}" 2>/dev/null; then
              echo "KEEP: $package has an executable-code reference"
            else
              echo "REMOVE: $package has no executable-code reference"
              removable+=("$package")
            fi
          done

          if [ "${#removable[@]}" -gt 0 ]; then
            printf '%s\n' "${removable[@]}" > /tmp/removable-dependencies.txt
            printf 'removable=%s\n' "${removable[*]}" >> "$GITHUB_OUTPUT"
          else
            : > /tmp/removable-dependencies.txt
            printf 'removable=\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Remove verified-unused dependencies
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t removable < /tmp/removable-dependencies.txt
          if [ "${#removable[@]}" -gt 0 ]; then
            npm uninstall "${removable[@]}"
          fi

      - name: Classify sharp as development tooling
        run: npm install --save-dev 'sharp@^0.35.3'

      - name: Validate regenerated dependency graph
        shell: bash
        run: |
          set -euo pipefail
          npm audit --audit-level=high
          npm run check:migrations
          npm run lint:js
          npm run typecheck
          npm run check:css-vars
          npm run check:css-classes
          npm run build

      - name: Commit generated package manifests
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'stockwise-maintenance-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo 'No dependency changes were required.'
            exit 0
          fi
          git commit -m 'chore: prune unused dependencies [dependency-lock-generated]'
          git push origin HEAD:cleanup/dependency-pruning-20260830
