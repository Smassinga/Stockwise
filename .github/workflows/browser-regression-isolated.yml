name: Browser Regression (Isolated)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'supabase/migrations/**'
      - 'tests/e2e/**'
      - 'playwright.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/browser-regression-isolated.yml'

permissions:
  contents: read

concurrency:
  group: browser-regression-isolated-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-regression:
    name: Ephemeral authenticated Chromium smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_TELEMETRY_DISABLED: '1'
      E2E_FIXTURE_PATH: /tmp/stockwise-e2e-fixture.json
      VITE_SITE_URL: http://127.0.0.1:3000

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.109.1

      - name: Start ephemeral Supabase stack
        run: supabase start

      - name: Export isolated local configuration
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          test "$API_URL" = 'http://127.0.0.1:54321'
          echo "::add-mask::$ANON_KEY"
          echo "::add-mask::$SERVICE_ROLE_KEY"
          {
            printf 'VITE_SUPABASE_URL=%s\n' "$API_URL"
            printf 'SUPABASE_URL=%s\n' "$API_URL"
            printf 'VITE_SUPABASE_ANON_KEY=%s\n' "$ANON_KEY"
            printf 'SUPABASE_ANON_KEY=%s\n' "$ANON_KEY"
            printf 'SUPABASE_SERVICE_ROLE_KEY=%s\n' "$SERVICE_ROLE_KEY"
            printf 'SERVICE_ROLE_KEY=%s\n' "$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      - name: Verify local-only mutation target
        shell: bash
        run: |
          set -euo pipefail
          test "$VITE_SUPABASE_URL" = 'http://127.0.0.1:54321'
          test "$SUPABASE_URL" = 'http://127.0.0.1:54321'
          for value in "$VITE_SUPABASE_URL" "$SUPABASE_URL"; do
            if [[ "$value" == *ogzhwoqqumkuqhbvuzzp* || "$value" == *.supabase.co* ]]; then
              echo 'Remote or production Supabase target rejected.' >&2
              exit 1
            fi
          done

      - name: Seed temporary authenticated company
        run: node tests/e2e/seed.mjs

      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium

      - name: Run authenticated browser smoke
        run: npx playwright test --project=chromium

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-regression-isolated-failure
          path: |
            playwright-report/
            test-results/
          retention-days: 3
          if-no-files-found: ignore

      - name: Stop ephemeral Supabase stack
        if: always()
        run: supabase stop --no-backup
