name: Settlements Receipts Cleanup Codemod

on:
  push:
    branches:
      - cleanup/final-cleanup-b-settlements-receipts

permissions:
  contents: write

jobs:
  extract-settlements-receipts:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Apply deterministic receipts extraction
        run: node scripts/refactor-settlements-receipts.mjs

      - name: Remove one-time extraction tooling
        run: |
          rm -f scripts/refactor-settlements-receipts.mjs
          rm -f .github/workflows/settlements-receipts-cleanup-codemod.yml

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint:js

      - name: Check UI foundations
        run: npm run check:ui-foundations

      - name: Runtime hardening continuity
        run: node --test tests/runtime-hardening/**/*.test.mjs

      - name: Service Jobs regression
        run: npm run test:service-jobs

      - name: Build production bundle
        run: npm run build

      - name: Commit extracted receipts workspace
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Settlements.tsx src/features/settlements/SettlementReceiptsWorkspace.tsx scripts/refactor-settlements-receipts.mjs .github/workflows/settlements-receipts-cleanup-codemod.yml
          git diff --cached --check
          git commit -m "refactor: extract settlements receipts workspace"
          git push origin HEAD:cleanup/final-cleanup-b-settlements-receipts
