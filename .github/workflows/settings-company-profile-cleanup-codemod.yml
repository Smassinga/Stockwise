name: Settings Company Profile Cleanup Codemod

on:
  push:
    branches:
      - cleanup/final-cleanup-b-settings-company-profile
    paths:
      - .cleanup/trigger-settings-company-profile-extraction

permissions:
  contents: write

jobs:
  extract-settings-company-profile:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Apply deterministic Settings extraction
        run: node scripts/refactor-settings-company-profile.mjs

      - name: Remove one-time extraction tooling
        run: |
          rm -f .cleanup/trigger-settings-company-profile-extraction
          rm -f scripts/refactor-settings-company-profile.mjs
          rm -f .github/workflows/settings-company-profile-cleanup-codemod.yml

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint:js

      - name: Check UI foundations
        run: npm run check:ui-foundations

      - name: Guard runtime hardening boundaries
        run: node --test tests/runtime-hardening/**/*.test.mjs

      - name: Service Jobs regression
        run: node --test tests/service-jobs/service-jobs-toast.test.mjs

      - name: Build production bundle
        env:
          VITE_SITE_URL: https://stockwiseapp.com
          VITE_SUPABASE_URL: https://stockwise-ci.invalid
          VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key
        run: npm run build

      - name: Commit extracted Settings company profile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: extract Settings company profile section"
          git push origin HEAD:cleanup/final-cleanup-b-settings-company-profile
