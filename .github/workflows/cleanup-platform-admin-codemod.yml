name: CLEANUP-4B platform admin codemod

on:
  push:
    branches:
      - cleanup/platform-admin-status-dedupe-20260830

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      VITE_SITE_URL: https://stockwiseapp.com
      VITE_SUPABASE_URL: https://stockwise-ci.invalid
      VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - uses: actions/checkout@v5
        with:
          ref: cleanup/platform-admin-status-dedupe-20260830
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Apply exact status-cache replacement
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/lib/companyAccess.ts')
          text = path.read_text(encoding='utf-8')
          old = """export async function getPlatformAdminStatus() {
            const { data, error } = await supabase.rpc('get_platform_admin_status')
            if (error) throw new Error(toFriendlyAccessError(error, 'Failed to load platform admin status.'))
            return unwrapSingle<PlatformAdminStatus>(data) || { is_admin: false }
          }
          """.replace('          ', '')
          new = """const PLATFORM_ADMIN_STATUS_CACHE_MS = 5000

          type PlatformAdminStatusCacheEntry = {
            key: string
            value: PlatformAdminStatus
            expiresAt: number
          }

          type PlatformAdminStatusInFlight = {
            key: string
            promise: Promise<PlatformAdminStatus>
          }

          let platformAdminStatusCache: PlatformAdminStatusCacheEntry | null = null
          let platformAdminStatusInFlight: PlatformAdminStatusInFlight | null = null

          export async function getPlatformAdminStatus(options?: { force?: boolean }) {
            const {
              data: { session },
            } = await supabase.auth.getSession()
            const cacheKey = session?.user?.id || 'anonymous'
            const now = Date.now()

            if (!options?.force) {
              if (
                platformAdminStatusCache?.key === cacheKey
                && platformAdminStatusCache.expiresAt > now
              ) {
                return platformAdminStatusCache.value
              }

              if (platformAdminStatusInFlight?.key === cacheKey) {
                return platformAdminStatusInFlight.promise
              }
            }

            const promise = (async () => {
              const { data, error } = await supabase.rpc('get_platform_admin_status')
              if (error) {
                throw new Error(toFriendlyAccessError(error, 'Failed to load platform admin status.'))
              }

              const value = unwrapSingle<PlatformAdminStatus>(data) || { is_admin: false }
              platformAdminStatusCache = {
                key: cacheKey,
                value,
                expiresAt: Date.now() + PLATFORM_ADMIN_STATUS_CACHE_MS,
              }
              return value
            })()

            platformAdminStatusInFlight = { key: cacheKey, promise }
            try {
              return await promise
            } finally {
              if (platformAdminStatusInFlight?.promise === promise) {
                platformAdminStatusInFlight = null
              }
            }
          }
          """.replace('          ', '')

          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one getPlatformAdminStatus block, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint:js
      - name: Type-check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Commit validated source change and remove temporary workflow
        run: |
          rm .github/workflows/cleanup-platform-admin-codemod.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/companyAccess.ts .github/workflows/cleanup-platform-admin-codemod.yml
          git commit -m "refactor: dedupe platform admin status reads"
          git push origin HEAD:cleanup/platform-admin-status-dedupe-20260830
