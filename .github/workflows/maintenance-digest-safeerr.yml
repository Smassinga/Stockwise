name: Maintenance Digest Error Path Repair

on:
  push:
    branches:
      - maintenance/security-ui-closeout-20260826
    paths:
      - '.github/workflows/maintenance-digest-safeerr.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: maintenance/security-ui-closeout-20260826

      - name: Add safe error normalization to digest worker
        shell: python
        run: |
          from pathlib import Path

          path = Path('supabase/functions/digest-worker/index.ts')
          text = path.read_text(encoding='utf-8')
          marker = '''function log(...args: unknown[]) {
            if (DEBUG_LOG) console.log(...args);
          }
          '''
          replacement = '''function log(...args: unknown[]) {
            if (DEBUG_LOG) console.log(...args);
          }

          function safeErr(error: unknown) {
            if (error instanceof Error) return error.message;
            try {
              return JSON.stringify(error);
            } catch {
              return String(error);
            }
          }
          '''
          if text.count(marker) != 1:
              raise SystemExit(f'expected one digest log marker, found {text.count(marker)}')
          if 'function safeErr(' in text:
              raise SystemExit('safeErr already exists; refusing duplicate repair')
          path.write_text(text.replace(marker, replacement), encoding='utf-8')

          test_path = Path('tests/runtime-hardening/runtime-hardening.test.mjs')
          test_text = test_path.read_text(encoding='utf-8')
          old = '''  assert.doesNotMatch(digest, /DEBUG_ACCEPT_QUERY_KEY/)
            assert.doesNotMatch(digest, /searchParams\\.get\\(["']key["']\\)/)
            assert.match(digest, /x-webhook-secret/)
            assert.match(digest, /Bearer /)
          })'''
          new = '''  assert.doesNotMatch(digest, /DEBUG_ACCEPT_QUERY_KEY/)
            assert.doesNotMatch(digest, /searchParams\\.get\\(["']key["']\\)/)
            assert.match(digest, /x-webhook-secret/)
            assert.match(digest, /Bearer /)
            assert.match(digest, /function safeErr\\(error: unknown\\)/)
          })'''
          if test_text.count(old) != 1:
              raise SystemExit(f'expected one digest runtime assertion block, found {test_text.count(old)}')
          test_path.write_text(test_text.replace(old, new), encoding='utf-8')

      - name: Verify repaired boundary
        run: |
          set -euo pipefail
          node --test tests/runtime-hardening/**/*.test.mjs
          npm ci --ignore-scripts
          npm run lint:js
          npm run typecheck
          npm run build

      - name: Commit repair
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/digest-worker/index.ts tests/runtime-hardening/runtime-hardening.test.mjs
          git diff --cached --check
          git commit -m 'fix: harden digest worker error path'
          git push origin HEAD:maintenance/security-ui-closeout-20260826
