name: Cleanup lockfile bootstrap

on:
  pull_request:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - tsconfig.app.json
      - .github/workflows/cleanup-lockfile-bootstrap.yml

permissions:
  contents: write

jobs:
  generate-lockfile:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Generate npm lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify generated lockfile
        run: npm ci --ignore-scripts

      - name: Commit generated lockfile and remove bootstrap
        shell: bash
        run: |
          rm .github/workflows/cleanup-lockfile-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/cleanup-lockfile-bootstrap.yml
          git diff --cached --check
          git commit -m "Cleanup C13: regenerate npm lockfile"
          git push origin HEAD:${{ github.head_ref }}
