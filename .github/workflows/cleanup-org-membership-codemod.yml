name: CLEANUP-4C organization membership extraction

on:
  push:
    branches:
      - cleanup/org-membership-reads-20260830

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      VITE_SITE_URL: https://stockwiseapp.com
      VITE_SUPABASE_URL: https://stockwise-ci.invalid
      VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - uses: actions/checkout@v5
        with:
          ref: cleanup/org-membership-reads-20260830
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Extract membership reads from useOrg
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('src/hooks/useOrg.tsx')
          text = path.read_text(encoding='utf-8')

          def exact(old: str, new: str, label: str):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 exact match, found {count}')
              text = text.replace(old, new)

          exact(
              'import type { MemberRole, MemberStatus } from "../lib/enums";\n',
              'import type { MemberStatus } from "../lib/enums";\n',
              'member role import',
          )

          exact(
              'import { withTimeout } from "../lib/withTimeout";\n',
              'import { withTimeout } from "../lib/withTimeout";\n'
              'import {\n'
              '  listActiveOrgMemberships,\n'
              '  listOrgCompanies,\n'
              '  pickBestOrgMemberships,\n'
              '  type OrgMembershipRow,\n'
              '} from "../lib/orgMemberships";\n',
              'organization helper import',
          )

          exact(
              '''function statusRank(s: MemberStatus) {\n  return { active: 0, invited: 1, disabled: 2 }[s] ?? 3;\n}\n\nfunction roleRank(r: MemberRole) {\n  // Prefer higher privileges when we must pick a default\n  return (\n    {\n      OWNER: 0,\n      ADMIN: 1,\n      MANAGER: 2,\n      OPERATOR: 3,\n      VIEWER: 4,\n    } as Record<string, number>\n  )[r] ?? 9\n}\n\n''',
              '',
              'membership rank helpers',
          )

          pattern = re.compile(r'\n  function pickBest\(\n.*?\n  \}\n\n  const maybeSyncCompanyContext', re.S)
          text, count = pattern.subn('\n  const maybeSyncCompanyContext', text, count=1)
          if count != 1:
              raise SystemExit(f'pickBest extraction: expected 1 match, found {count}')

          pattern = re.compile(
              r'    let memsByUser: any\[\] \| null = null;\n'
              r'.*?'
              r'    \} catch \(e\) \{\n'
              r'      memErr = e;\n'
              r'    \}\n\n'
              r'    if \(memErr\) \{',
              re.S,
          )
          replacement = '''    let mergedMemberships: OrgMembershipRow[] = [];\n    let memErr: unknown = null;\n    try {\n      mergedMemberships = await listActiveOrgMemberships(\n        user.id,\n        user.email,\n        ORG_QUERY_TIMEOUT_MS\n      );\n    } catch (e) {\n      memErr = e;\n    }\n\n    if (memErr) {'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'membership query extraction: expected 1 match, found {count}')

          exact(
              '    const mergedMemberships = [...(memsByUser ?? []), ...(memsByEmail ?? [])];\n'
              '    const meta = pickBest(mergedMemberships as any);\n',
              '    const meta = pickBestOrgMemberships(mergedMemberships);\n',
              'membership ranking call',
          )

          pattern = re.compile(
              r'    // company names\n'
              r'    let rows: Array<\{ id: string; name: string \| null \}> \| null = null;\n'
              r'.*?'
              r'    \} catch \(e\) \{\n'
              r'      compErr = e;\n'
              r'    \}\n'
              r'    if \(compErr\) \{',
              re.S,
          )
          replacement = '''    // company names\n    let rows: OrgCompany[] | null = null;\n    let compErr: unknown = null;\n    try {\n      rows = await listOrgCompanies(ids, ORG_QUERY_TIMEOUT_MS);\n    } catch (e) {\n      compErr = e;\n    }\n    if (compErr) {'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'company query extraction: expected 1 match, found {count}')

          path.write_text(text, encoding='utf-8')
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint:js
      - name: Type-check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Commit validated extraction and remove temporary workflow
        run: |
          rm .github/workflows/cleanup-org-membership-codemod.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/hooks/useOrg.tsx src/lib/orgMemberships.ts .github/workflows/cleanup-org-membership-codemod.yml
          git commit -m "refactor: extract typed organization membership reads"
          git push origin HEAD:cleanup/org-membership-reads-20260830
