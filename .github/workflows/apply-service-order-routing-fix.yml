name: Apply service order routing fix

on:
  push:
    branches:
      - fix/service-orders-skip-warehouse
    paths:
      - .github/workflows/apply-service-order-routing-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Route service lines away from warehouse fulfilment
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/pages/Orders/SalesOrders.tsx')
          text = path.read_text()

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              "      const lines = solines.filter((line) => line.so_id === selectedSO.id && remaining(line) > 0)",
              "      const lines = solines.filter((line) => line.so_id === selectedSO.id && remaining(line) > 0 && itemById.get(line.item_id)?.primaryRole !== 'service')",
              'stock source planning',
          )

          old = "  async function doShipLineSO(so: SO, line: SOL, options?: { silent?: boolean; refresh?: boolean }) {\n    try {\n      const lineKey = String(line.id)"
          new = "  async function doShipLineSO(so: SO, line: SOL, options?: { silent?: boolean; refresh?: boolean }) {\n    try {\n      if (itemById.get(line.item_id)?.primaryRole === 'service') {\n        throw new Error(tt('orders.serviceUsesServiceJobs', 'Service lines are fulfilled through Service Jobs, not warehouse issue.'))\n      }\n      const lineKey = String(line.id)"
          replace_once(old, new, 'single-line shipment guard')

          replace_once(
              "      const lines = solines.filter((line) => line.so_id === so.id && remaining(line) > 0)",
              "      const lines = solines.filter((line) => line.so_id === so.id && remaining(line) > 0 && itemById.get(line.item_id)?.primaryRole !== 'service')",
              'batch shipment filtering',
          )

          old = "  const selectedSOOpenLines = useMemo(\n    () => selectedSOLines.filter((line) => remaining(line) > 0),\n    [selectedSOLines]\n  )\n  const selectedSORemainingQty = useMemo(\n    () => selectedSOOpenLines.reduce((sum, line) => sum + remaining(line), 0),\n    [selectedSOOpenLines]\n  )"
          new = "  const selectedSOOpenLines = useMemo(\n    () => selectedSOLines.filter((line) => remaining(line) > 0),\n    [selectedSOLines]\n  )\n  const selectedSOInventoryOpenLines = useMemo(\n    () => selectedSOOpenLines.filter((line) => itemById.get(line.item_id)?.primaryRole !== 'service'),\n    [itemById, selectedSOOpenLines]\n  )\n  const selectedSORemainingQty = useMemo(\n    () => selectedSOInventoryOpenLines.reduce((sum, line) => sum + remaining(line), 0),\n    [selectedSOInventoryOpenLines]\n  )"
          replace_once(old, new, 'inventory open-line projection')

          replace_once(
              "                    {canIssueFromStatus(selectedSO.status) && (",
              "                    {canIssueFromStatus(selectedSO.status) && selectedSOInventoryOpenLines.length > 0 && (",
              'batch issue action visibility',
          )

          old = "                    value: fmtAcct(selectedSORemainingQty),\n                    hint: tt('orders.remainingQtyHelp', 'Use the allocation section below to split the remaining issue quantity across source bins.'),"
          new = "                    value: fmtAcct(selectedSORemainingQty),\n                    hint: tt('orders.remainingStockQtyHelp', 'Remaining stock quantity that still needs warehouse issue. Service lines are completed through Service Jobs.'),"
          replace_once(old, new, 'remaining quantity help')

          old = "                    eyebrowKey: 'commercial.lifecycle.stock',\n                    eyebrowFallback: 'Stock',"
          new = "                    eyebrowKey: 'commercial.lifecycle.fulfilment',\n                    eyebrowFallback: 'Fulfilment',"
          replace_once(old, new, 'lifecycle fulfilment label')

          old = "                    descriptionKey: 'commercial.lifecycle.salesStockHelp',\n                    descriptionFallback: 'Shipment remains an operational stock workflow.',"
          new = "                    descriptionKey: 'commercial.lifecycle.salesFulfilmentHelp',\n                    descriptionFallback: 'Stock items use warehouse issue; services use Service Jobs.',"
          replace_once(old, new, 'lifecycle fulfilment help')

          old = "              <OrderDetailSection\n                title={tt('orders.defaultIssueWarehouse', 'Default warehouse for new allocations')}"
          new = "              {selectedSOInventoryOpenLines.length > 0 && (\n              <OrderDetailSection\n                title={tt('orders.defaultIssueWarehouse', 'Default warehouse for new allocations')}"
          replace_once(old, new, 'default warehouse section guard')

          old = "              </OrderDetailSection>\n\n              <OrderDetailSection\n                title={tt('orders.issueAllocations', 'Issue allocations')}"
          new = "              </OrderDetailSection>\n              )}\n\n              {selectedSOInventoryOpenLines.length > 0 && (\n              <OrderDetailSection\n                title={tt('orders.issueAllocations', 'Issue allocations')}"
          replace_once(old, new, 'issue section guard')

          replace_once(
              "                  {selectedSOOpenLines.map(l => {",
              "                  {selectedSOInventoryOpenLines.map(l => {",
              'inventory allocation line list',
          )
          replace_once(
              "                  {selectedSOOpenLines.length === 0 && (",
              "                  {selectedSOInventoryOpenLines.length === 0 && (",
              'inventory empty-state line list',
          )

          old = "              </OrderDetailSection>\n\n              <OrderAuditGrid"
          new = "              </OrderDetailSection>\n              )}\n\n              <OrderAuditGrid"
          replace_once(old, new, 'issue section closing guard')

          path.write_text(text)
          PY

      - name: Run service fulfilment regression tests
        run: node --test tests/service-jobs/service-order-fulfilment.test.mjs

      - name: Commit fix to branch
        shell: bash
        run: |
          git rm .github/workflows/apply-service-order-routing-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Orders/SalesOrders.tsx
          git commit -m "fix(orders): route services through service jobs"
          git push origin HEAD:fix/service-orders-skip-warehouse
