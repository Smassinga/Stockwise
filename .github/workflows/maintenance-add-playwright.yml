name: Maintenance Add Playwright

on:
  push:
    branches:
      - maintenance/security-ui-closeout-20260826
    paths:
      - '.github/workflows/maintenance-add-playwright.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: maintenance/security-ui-closeout-20260826

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Add pinned Playwright test dependency
        run: npm install --save-dev --save-exact @playwright/test@1.62.1

      - name: Verify dependency and existing static gates
        run: |
          npm ci
          npx playwright --version
          npm run lint:js
          npm run typecheck
          node --test tests/runtime-hardening/**/*.test.mjs
          npm run build

      - name: Commit dependency lock
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git diff --cached --check
          git commit -m 'test: add pinned Playwright browser dependency'
          git push origin HEAD:maintenance/security-ui-closeout-20260826
