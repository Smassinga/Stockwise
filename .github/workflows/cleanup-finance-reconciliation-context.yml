name: CLEANUP-5A finance reconciliation context

on:
  push:
    branches:
      - cleanup/finance-reconciliation-context-20260831

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: cleanup/finance-reconciliation-context-20260831

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Extract duplicated reconciliation context usage
        run: python .github/scripts/cleanup_finance_reconciliation_context.py

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:js

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Commit validated extraction and remove temporary staging files
        shell: bash
        run: |
          rm .github/workflows/cleanup-finance-reconciliation-context.yml
          rm .github/scripts/cleanup_finance_reconciliation_context.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A src .github/workflows/cleanup-finance-reconciliation-context.yml .github/scripts/cleanup_finance_reconciliation_context.py
          git diff --cached --check
          git commit -m 'refactor: share finance reconciliation context reads'
          git push origin HEAD:cleanup/finance-reconciliation-context-20260831
