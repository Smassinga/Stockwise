name: CLEANUP-6I Growth Batch loss reconciliation

on:
  push:
    branches:
      - cleanup/growth-batch-loss-reconcile-20260831

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Reconcile Growth Batch loss section
        run: python3 scripts/reconcile_growth_batch_loss_section.py
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint:js
      - name: Type-check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Commit validated reconciliation and remove temporary staging files
        run: |
          rm scripts/reconcile_growth_batch_loss_section.py
          rm .github/workflows/reconcile-growth-batch-loss-section.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/GrowthBatches.tsx src/pages/growthBatches/GrowthBatchLossSection.tsx scripts/reconcile_growth_batch_loss_section.py .github/workflows/reconcile-growth-batch-loss-section.yml
          git commit -m "refactor: reconcile Growth Batch loss section"
          git push origin HEAD:cleanup/growth-batch-loss-reconcile-20260831
