name: CLEANUP-7B remove role compatibility shim

on:
  push:
    branches:
      - cleanup/remove-role-compat-shim-20260831

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    env:
      VITE_SITE_URL: https://stockwiseapp.com
      VITE_SUPABASE_URL: https://stockwise-ci.invalid
      VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - uses: actions/checkout@v5
        with:
          ref: cleanup/remove-role-compat-shim-20260831
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Apply guarded canonical role migration
        run: python scripts/cleanup_remove_role_compat.py

      - name: Install dependencies
        run: npm ci

      - name: Run role boundary regression
        run: node --test tests/runtime-hardening/role-permission-boundary.test.mjs

      - name: Lint
        run: npm run lint:js

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Commit validated migration and remove temporary staging files
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="77e7881948e365794c81f83870fdebf35a345465"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/cleanup_remove_role_compat.py .github/workflows/cleanup-remove-role-compat.yml
          git add docs/DATA_MODEL.md src tests/runtime-hardening/role-permission-boundary.test.mjs

          git commit -m "refactor: remove legacy role compatibility shim"

          mapfile -t durable < <(git diff --name-only "$BASE_SHA"...HEAD | sort)
          durable_expected=(
            "docs/DATA_MODEL.md"
            "src/App.tsx"
            "src/components/layout/AppLayout.tsx"
            "src/hooks/useOrg.tsx"
            "src/lib/permissions.ts"
            "src/lib/roles.ts"
            "src/pages/BankDetail.tsx"
            "src/pages/Banks.tsx"
            "src/pages/GrowthBatches.tsx"
            "src/pages/ProductionRuns.tsx"
            "src/pages/Users.tsx"
            "tests/runtime-hardening/role-permission-boundary.test.mjs"
          )
          mapfile -t durable_expected_sorted < <(printf '%s\n' "${durable_expected[@]}" | sort)
          if [[ "${durable[*]}" != "${durable_expected_sorted[*]}" ]]; then
            printf 'Unexpected durable branch diff:\n%s\n' "${durable[*]}"
            exit 1
          fi

          if git grep -nE "(?:from|import\()[[:space:]]*['\"][^'\"]*/roles['\"]" -- src; then
            echo "Legacy role import remains"
            exit 1
          fi

          git push origin HEAD:cleanup/remove-role-compat-shim-20260831
