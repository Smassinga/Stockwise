name: CLEANUP-6C finance detail lines

on:
  push:
    branches:
      - cleanup/finance-detail-lines-20260831

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Extract finance detail line tables
        run: python scripts/cleanup_finance_detail_lines.py
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint:js
      - name: Type-check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Commit validated extraction and remove temporary staging files
        run: |
          rm .github/workflows/cleanup-finance-detail-lines.yml
          rm scripts/cleanup_finance_detail_lines.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/SalesInvoiceDetail.tsx src/pages/VendorBillDetail.tsx src/components/finance/SalesInvoiceLinesCard.tsx src/components/finance/VendorBillLinesCard.tsx .github/workflows/cleanup-finance-detail-lines.yml scripts/cleanup_finance_detail_lines.py
          git commit -m 'refactor: extract finance detail line tables'
          git push origin HEAD:cleanup/finance-detail-lines-20260831
