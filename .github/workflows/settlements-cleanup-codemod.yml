name: Settlements Cleanup Codemod

on:
  push:
    branches:
      - cleanup/final-cleanup-b-settlements
    paths:
      - .cleanup/trigger-settlements-model-extraction

permissions:
  contents: write

jobs:
  extract-settlements-model:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply deterministic Settlements extraction
        run: node scripts/refactor-settlements-model.mjs

      - name: Remove one-time trigger
        run: rm -f .cleanup/trigger-settlements-model-extraction

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint:js

      - name: Check UI foundations
        run: npm run check:ui-foundations

      - name: Service Jobs regression
        run: npm run test:service-jobs

      - name: Build production bundle
        run: npm run build

      - name: Commit extracted feature boundary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor: extract settlements model helpers"
          git push origin HEAD:${GITHUB_REF_NAME}
