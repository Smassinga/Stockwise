name: Maintenance Runtime And Docs Repair

on:
  push:
    branches:
      - maintenance/security-ui-closeout-20260826
    paths:
      - '.github/workflows/maintenance-runtime-docs-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: maintenance/security-ui-closeout-20260826

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Apply exact runtime and documentation repairs
        shell: python
        run: |
          from pathlib import Path
          import json

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one exact match, found {count}')
              file.write_text(text.replace(old, new), encoding='utf-8')

          digest = Path('supabase/functions/digest-worker/index.ts')
          text = digest.read_text(encoding='utf-8')
          text = text.replace(
              '// Auth gate: X-Webhook-Secret header, Authorization: Bearer <secret>, or ?key= when DEBUG_ACCEPT_QUERY_KEY=true.',
              '// Auth gate: X-Webhook-Secret header or Authorization: Bearer <secret>.',
          )
          text = text.replace('const DEBUG_ACCEPT_QUERY_KEY = (Deno.env.get("DEBUG_ACCEPT_QUERY_KEY") ?? "false").toLowerCase() === "true";\n', '')
          old_auth = '''function authorized(req: Request) {
            if (!DIGEST_HOOK_SECRET) return false;
            const headerSecret = req.headers.get("x-webhook-secret") ?? "";
            const auth = req.headers.get("authorization") ?? "";
            const bearer = auth.startsWith("Bearer ") ? auth.slice(7) : "";
            const querySecret = new URL(req.url).searchParams.get("key") ?? "";
            const ok =
              headerSecret === DIGEST_HOOK_SECRET ||
              bearer === DIGEST_HOOK_SECRET ||
              (DEBUG_ACCEPT_QUERY_KEY && querySecret === DIGEST_HOOK_SECRET);
            log("[auth]", { header: !!headerSecret, bearer: !!bearer, query: !!querySecret, ok });
            return ok;
          }'''
          new_auth = '''function authorized(req: Request) {
            if (!DIGEST_HOOK_SECRET) return false;
            const headerSecret = req.headers.get("x-webhook-secret") ?? "";
            const auth = req.headers.get("authorization") ?? "";
            const bearer = auth.startsWith("Bearer ") ? auth.slice(7) : "";
            const ok = headerSecret === DIGEST_HOOK_SECRET || bearer === DIGEST_HOOK_SECRET;
            log("[auth]", { header: !!headerSecret, bearer: !!bearer, ok });
            return ok;
          }'''
          if text.count(old_auth) != 1:
              raise SystemExit('digest-worker: authorization block did not match exactly once')
          digest.write_text(text.replace(old_auth, new_auth), encoding='utf-8')

          replace_once(
              'docs/DEVELOPMENT.md',
              'UX-9C advances the maintained schema baseline to 46 migrations through `20260729143000_add_owner_dashboard_read_model.sql`. `npm run check:migrations` must report 46 active migrations, and the isolated finance workflow guard must use the same count and latest version.',
              'As of 2026-08-26, the maintained schema chain has 72 migrations through `20260826085721_ensure_companies_owner_user_id_index.sql`. `npm run check:migrations` derives migration truth from `supabase/migrations`; CI and isolated replay must not hard-code a historical count or latest version. Later phase sections in this guide retain release-era counts only as historical evidence and must not override this current baseline.',
          )
          replace_once(
              'docs/DEVELOPMENT.md',
              '''npm install
          npm run dev
          npm run lint:js
          npm run check:ui-foundations
          npm run build''',
              '''npm install
          npm run dev
          npm run lint:js
          npm run typecheck
          npm run check:ui-foundations
          npm run test:dashboard
          npm run test:service-jobs
          npm run build''',
          )
          replace_once(
              'docs/DEVELOPMENT.md',
              'Current release state: hosted production and local replay have 45 active migrations through `20260716130533_add_pos_tax_applicability_mode.sql`. The live settlement boundary normalizes exact two-decimal money values without epsilon, and the live commercial-tax boundary derives canonical headers and finance-state totals from line snapshots. Growth Batches G5.1 depleting harvest/event-specific harvest reversal and G5.2 completion/event-specific completion reversal remain live and production-smoke validated.',
              'Current release state: hosted production and the maintained repository are aligned through 72 migrations ending at `20260826085721_ensure_companies_owner_user_id_index.sql`. The 2026-08-26 maintenance closeout also hardens SECURITY DEFINER execution privileges and records the company-owner foreign-key index in forward migration history. The release-era migration counts in the phase notes below are historical validation snapshots, not current schema truth.',
          )
          replace_once(
              'docs/DEVELOPMENT.md',
              'The full repository TypeScript diagnostic currently exposes pre-existing debt and is not yet a safe merge gate. Do not hide or expand that debt. New or changed code must remain type-safe, and a dedicated full typecheck gate should be enabled only after the existing baseline is remediated rather than suppressing errors globally.',
              '`npm run typecheck` is now an always-on Validation gate. The previous nine-diagnostic baseline has been remediated without blanket exclusions or suppressions. New or changed code must keep the full application typecheck green.',
          )

          replace_once(
              'docs/TESTING.md',
              'OPS-1 adds `npm run test:ops-1` for receipt authority, report recognition, export identity, MZN formatting, email registry/security, and notification targeting. A zero migration replay must apply 52 migrations. Preserved gates are finance 393, dashboard 25, and Service Jobs 34 (the database integration case requires the isolated loopback environment). Build output is removed before commit.',
              'OPS-1 adds `npm run test:ops-1` for receipt authority, report recognition, export identity, MZN formatting, email registry/security, and notification targeting. The 52-migration statement was an OPS-1 release-era snapshot; current migration truth is derived dynamically from the repository and is 72 migrations through `20260826085721_ensure_companies_owner_user_id_index.sql` as of 2026-08-26. Historical regression counts remain evidence for their release, while current CI must use the commands and workflow definitions below. Build and browser-output artifacts are not committed.',
          )
          replace_once(
              'docs/TESTING.md',
              '''- lint and build checks for every material code change
          - a non-mutating GitHub Actions validation gate for pull requests and pushes to `main`
          - a real finance regression suite driven by the Node test runner and live Supabase clients''',
              '''- lint, full TypeScript, UI-foundation, dashboard, Service Job, and production-build checks in normal Validation
          - a non-mutating GitHub Actions validation gate for pull requests and pushes to `main`
          - a protected finance regression suite driven by the Node test runner and Supabase clients
          - an isolated finance GitHub Actions workflow that starts an ephemeral loopback Supabase stack and derives expected migration truth from the checked-out repository''',
          )
          replace_once(
              'docs/TESTING.md',
              '''npm ci
          npm run check:migrations
          npm run lint:js
          npm run check:css-vars
          npm run check:css-classes
          npm run check:ui-foundations
          npm run build''',
              '''npm ci
          npm run check:migrations
          npm run lint:js
          npm run typecheck
          npm run check:css-vars
          npm run check:css-classes
          npm run check:ui-foundations
          npm run test:dashboard
          npm run test:service-jobs
          npm run build''',
          )
          replace_once(
              'docs/TESTING.md',
              'Lighthouse is not a merge gate in the current repository. If introduced later, it should report regressions and diagnostic evidence; a score is not a compliance claim. Full TypeScript validation is also not an always-on gate yet because the existing repository diagnostic has pre-existing errors outside UX-10A/10B. Enabling it remains follow-up work after that debt is corrected without blanket exclusions.',
              'Lighthouse is not a merge gate in the current repository. If introduced later, it should report regressions and diagnostic evidence; a score is not a compliance claim. Full TypeScript validation is now an always-on gate through `npm run typecheck`; the previous repository diagnostics were repaired without blanket exclusions.',
          )
          replace_once(
              'docs/TESTING.md',
              '''`npm run test:finance-regression` is intentionally not part of always-on public CI because it uses live Supabase clients, requires service-role access, creates temporary Auth/company/finance data, and then cleans it up. It remains a protected manual release gate until a dedicated isolated Supabase test project and guarded GitHub Actions secrets are configured.

          If finance regression is later enabled in CI, use a non-production Supabase project only and provide these secrets through protected GitHub Actions environments:

          - `VITE_SUPABASE_URL` or `SUPABASE_URL`
          - `VITE_SUPABASE_ANON_KEY` or `SUPABASE_ANON_KEY`
          - `SUPABASE_SERVICE_ROLE_KEY` or `SERVICE_ROLE_KEY`''',
              '''`npm run test:finance-regression` remains the protected developer command and production targets remain hard-blocked by the test helper. CI now also runs `.github/workflows/finance-regression-isolated.yml` for finance or migration-sensitive pull-request changes. That workflow starts an ephemeral loopback Supabase stack, replays the checked-out migration chain, derives the expected migration count/latest version from the repository, and runs `npm run test:finance-regression:ci` without production credentials.''',
          )
          replace_once(
              'docs/TESTING.md',
              'Hosted production and local replay now have 39 migrations through `20260709222842_governed_settlement_posting.sql`.',
              'Historical settlement-release snapshot: hosted production and local replay had 39 migrations through `20260709222842_governed_settlement_posting.sql` at that release. This is not the current migration baseline; use the current status section above.',
          )

          package_path = Path('package.json')
          package = json.loads(package_path.read_text(encoding='utf-8'))
          package['name'] = 'stockwise'
          scripts = package['scripts']
          scripts['dev:lan'] = 'vite --host 0.0.0.0'
          scripts['lint:css'] = 'stylelint "src/**/*.css" --quiet'
          scripts['lint:css:fix'] = 'stylelint "src/**/*.css" --fix --quiet'
          package_path.write_text(json.dumps(package, indent=2) + '\n', encoding='utf-8')

      - name: Refresh lockfile metadata
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify repaired source
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run check:migrations
          npm run lint:js
          npm run typecheck
          npm run check:css-vars
          npm run check:css-classes
          npm run check:ui-foundations
          npm run test:dashboard
          npm run test:service-jobs
          npm run build

      - name: Commit repairs
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/digest-worker/index.ts docs/DEVELOPMENT.md docs/TESTING.md package.json package-lock.json
          git diff --cached --check
          git commit -m 'chore: align runtime docs and package metadata'
          git push origin HEAD:maintenance/security-ui-closeout-20260826
