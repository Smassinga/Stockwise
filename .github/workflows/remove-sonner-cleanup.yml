name: Remove Sonner Cleanup

on:
  push:
    branches:
      - cleanup/final-cleanup-c-remove-sonner
    paths:
      - .cleanup/trigger-remove-sonner

permissions:
  contents: write

jobs:
  remove-sonner:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Remove confirmed-dead Sonner dependency
        run: npm uninstall sonner --save

      - name: Verify Sonner is absent from direct dependencies
        run: |
          node -e "const p=require('./package.json'); if (p.dependencies?.sonner || p.devDependencies?.sonner) process.exit(1)"
          if npm ls sonner --depth=0 >/dev/null 2>&1; then
            echo 'sonner is still installed as a direct dependency'
            exit 1
          fi

      - name: Remove one-time cleanup tooling
        run: |
          rm -f .cleanup/trigger-remove-sonner
          rm -f .github/workflows/remove-sonner-cleanup.yml

      - name: Reinstall from regenerated lockfile
        run: npm ci

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint:js

      - name: Type-check
        run: npm run typecheck

      - name: Guard runtime hardening boundaries
        run: node --test tests/runtime-hardening/**/*.test.mjs

      - name: Service Jobs regression
        run: npm run test:service-jobs

      - name: Build production bundle
        env:
          VITE_SITE_URL: https://stockwiseapp.com
          VITE_SUPABASE_URL: https://stockwise-ci.invalid
          VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key
        run: npm run build

      - name: Commit dependency cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove dead sonner dependency"
          git push origin HEAD:cleanup/final-cleanup-c-remove-sonner
