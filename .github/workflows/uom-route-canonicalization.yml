name: UOM Route Canonicalization

on:
  push:
    branches:
      - cleanup/final-cleanup-c-uom-route
    paths:
      - .cleanup/trigger-uom-route-canonicalization

permissions:
  contents: write

jobs:
  canonicalize-uom-route:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Apply deterministic route canonicalization
        run: node scripts/canonicalize-uom-route.mjs

      - name: Remove one-time cleanup tooling
        run: |
          rm -f .cleanup/trigger-uom-route-canonicalization
          rm -f scripts/canonicalize-uom-route.mjs
          rm -f .github/workflows/uom-route-canonicalization.yml

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:js

      - name: Type-check
        run: npm run typecheck

      - name: Guard runtime hardening boundaries
        run: node --test tests/runtime-hardening/**/*.test.mjs

      - name: Service Jobs regression
        run: npm run test:service-jobs

      - name: Build production bundle
        env:
          VITE_SITE_URL: https://stockwiseapp.com
          VITE_SUPABASE_URL: https://stockwise-ci.invalid
          VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key
        run: npm run build

      - name: Commit route canonicalization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: canonicalize UOM route"
          git push origin HEAD:cleanup/final-cleanup-c-uom-route
