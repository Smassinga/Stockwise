name: CLEANUP-6A finance reconciliation card

on:
  push:
    branches:
      - cleanup/finance-reconciliation-card-20260831

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Extract reconciliation review presentation
        run: python scripts/cleanup_finance_reconciliation_card.py
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint:js
      - name: Type-check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Commit validated extraction and remove temporary staging files
        run: |
          rm .github/workflows/cleanup-finance-reconciliation-card.yml
          rm scripts/cleanup_finance_reconciliation_card.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/SalesInvoiceDetail.tsx src/pages/VendorBillDetail.tsx src/components/finance/FinanceReconciliationReviewCard.tsx .github/workflows/cleanup-finance-reconciliation-card.yml scripts/cleanup_finance_reconciliation_card.py
          git commit -m 'refactor: extract finance reconciliation review card'
          git push origin HEAD:cleanup/finance-reconciliation-card-20260831
