name: CLEANUP-6F growth batch types

on:
  push:
    branches:
      - cleanup/growth-batch-types-20260831

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Extract growth batch workspace types
        run: python scripts/cleanup_growth_batch_types.py
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint:js
      - name: Type-check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Commit validated extraction and remove temporary staging files
        shell: bash
        run: |
          rm scripts/cleanup_growth_batch_types.py
          rm .github/workflows/cleanup-growth-batch-types.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/growthBatchTypes.ts src/pages/GrowthBatches.tsx scripts/cleanup_growth_batch_types.py .github/workflows/cleanup-growth-batch-types.yml
          git commit -m 'refactor: extract growth batch workspace types'
          git push origin HEAD:cleanup/growth-batch-types-20260831
