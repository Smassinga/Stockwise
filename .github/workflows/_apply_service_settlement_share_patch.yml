name: Apply service settlement share patch

on:
  push:
    branches:
      - fix/service-settlement-share-20260917
    paths:
      - .github/workflows/_apply_service_settlement_share_patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/service-settlement-share-20260917
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply source patch
        run: python scripts/apply-service-settlement-share-patch.py
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Service Job regression tests
        run: npm run test:service-jobs
      - name: Commit patch
        run: |
          git config user.name "StockWise Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/_apply_service_settlement_share_patch.yml scripts/apply-service-settlement-share-patch.py
          git add src/pages/Settlements.tsx src/pages/ServiceJobs.tsx
          git commit -m "fix(finance): govern service collection shares"
          git push origin HEAD:fix/service-settlement-share-20260917
