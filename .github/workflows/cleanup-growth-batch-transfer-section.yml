name: CLEANUP-6H Growth Batch transfer section

on:
  push:
    branches:
      - cleanup/growth-batch-transfer-section-20260831

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Extract Growth Batch transfer section
        run: python3 scripts/cleanup_growth_batch_transfer_section.py
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint:js
      - name: Type-check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Commit validated extraction and remove temporary staging files
        run: |
          rm scripts/cleanup_growth_batch_transfer_section.py
          rm .github/workflows/cleanup-growth-batch-transfer-section.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/GrowthBatches.tsx src/pages/growthBatches/GrowthBatchTransferSection.tsx scripts/cleanup_growth_batch_transfer_section.py .github/workflows/cleanup-growth-batch-transfer-section.yml
          git commit -m "refactor: extract Growth Batch transfer section"
          git push origin HEAD:cleanup/growth-batch-transfer-section-20260831
