name: Data Access Cleanup Helper

on:
  push:
    branches:
      - cleanup/data-access-20260830

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[data-access-cleanup-generated]') }}
    runs-on: ubuntu-24.04
    env:
      VITE_SITE_URL: https://stockwiseapp.com
      VITE_SUPABASE_URL: https://stockwise-ci.invalid
      VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@v5
        with:
          ref: cleanup/data-access-20260830
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Replace db facade consumers
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')

          const roots = ['src']
          const extensions = new Set(['.ts', '.tsx'])
          const files = []

          function walk(target) {
            const stat = fs.statSync(target)
            if (stat.isFile()) {
              if (extensions.has(path.extname(target))) files.push(target)
              return
            }
            for (const entry of fs.readdirSync(target, { withFileTypes: true })) {
              walk(path.join(target, entry.name))
            }
          }

          roots.forEach(walk)

          let rewrittenImports = 0
          for (const file of files) {
            if (file === 'src/lib/db.ts') continue
            let text = fs.readFileSync(file, 'utf8')
            const before = text
            text = text
              .replaceAll("from '../lib/db'", "from '../lib/supabase'")
              .replaceAll('from "../lib/db"', 'from "../lib/supabase"')
              .replaceAll("from '../../lib/db'", "from '../../lib/supabase'")
              .replaceAll('from "../../lib/db"', 'from "../../lib/supabase"')
            if (text !== before) {
              rewrittenImports += 1
              fs.writeFileSync(file, text)
            }
          }

          if (rewrittenImports !== 15) {
            throw new Error(`Expected to rewrite 15 Supabase re-export consumers, rewrote ${rewrittenImports}`)
          }

          const currencyPath = 'src/lib/currency.ts'
          let currency = fs.readFileSync(currencyPath, 'utf8')
          const importLine = "import { db } from './db'\n"
          if (!currency.includes(importLine)) throw new Error('Legacy db import not found in currency.ts')
          currency = currency.replace(importLine, '')

          const legacyBlock = `  try {\n    const settings = await db.settings.get('app')\n    const code = settings?.baseCurrencyCode || 'MZN'\n    writeCurrencyCache(code, resolvedCompanyId)\n    return code\n  } catch {\n    return 'MZN'\n  }`
          const explicitBlock = `  try {\n    const { data, error } = await supabase\n      .from('settings')\n      .select('baseCurrencyCode')\n      .eq('id', 'app')\n      .limit(1)\n\n    if (error) throw error\n    const settings = Array.isArray(data) && data.length > 0 ? data[0] : null\n    const code = settings?.baseCurrencyCode || 'MZN'\n    writeCurrencyCache(code, resolvedCompanyId)\n    return code\n  } catch {\n    return 'MZN'\n  }`
          if (!currency.includes(legacyBlock)) throw new Error('Legacy settings fallback block not found in currency.ts')
          currency = currency.replace(legacyBlock, explicitBlock)
          fs.writeFileSync(currencyPath, currency)

          fs.unlinkSync('src/lib/db.ts')

          const scanFiles = []
          function scanWalk(target) {
            if (!fs.existsSync(target)) return
            const stat = fs.statSync(target)
            if (stat.isFile()) {
              if (['.ts', '.tsx', '.js', '.jsx', '.mjs', '.cjs'].includes(path.extname(target))) scanFiles.push(target)
              return
            }
            for (const entry of fs.readdirSync(target, { withFileTypes: true })) {
              if (entry.name === 'node_modules' || entry.name === 'dist') continue
              scanWalk(path.join(target, entry.name))
            }
          }
          ;['src', 'scripts', 'tests'].forEach(scanWalk)

          const stale = []
          for (const file of scanFiles) {
            const text = fs.readFileSync(file, 'utf8')
            const lines = text.split(/\r?\n/)
            lines.forEach((line, index) => {
              const normalized = line.replace(/\\/g, '/')
              if (normalized.includes('/lib/db') || normalized.includes('@/lib/db')) {
                stale.push(`${file}:${index + 1}: ${line.trim()}`)
              }
              if (/\bdb\s*\./.test(line)) {
                stale.push(`${file}:${index + 1}: ${line.trim()}`)
              }
            })
          }
          if (stale.length) throw new Error(`Stale db facade references remain:\n${stale.join('\n')}`)
          NODE

      - name: Validate data access cleanup
        shell: bash
        run: |
          set -euo pipefail
          npm run check:migrations
          npm run lint:js
          npm run typecheck
          npm run check:css-vars
          npm run check:css-classes
          npm run test:dashboard
          npm run test:service-jobs
          npm run build

      - name: Commit validated source cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'stockwise-maintenance-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src
          git commit -m 'refactor: retire generic db facade [data-access-cleanup-generated]'
          git push origin HEAD:cleanup/data-access-20260830
